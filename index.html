<meta name="mobile-web-app-capable" content="yes">

*{box-sizing:border-box}
i{font-style:normal}
body{margin:0;background:#0f0f0f;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
:root{--g-bg:#0f0f0f;--g-surf:#1c1c1c;--g-surf2:#252525;--g-text:#f5f5f5;--g-text2:#aaa;--g-muted:#666;--g-border:#333}
.gym-wrap{max-width:520px;margin:0 auto;padding:1rem 1rem 3rem}
.gym-topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.gym-topbar i{font-size:20px;color:var(--g-text2);cursor:pointer}
.gym-brand{font-size:11px;color:var(--g-muted);letter-spacing:0.6px;text-transform:uppercase;margin-bottom:6px;font-weight:500}
.gym-title{font-size:18px;font-weight:600;flex:1}
.gym-fab{position:relative;width:52px;height:52px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;cursor:pointer;margin:0 auto}
.gym-fab-small{width:38px;height:38px;font-size:18px;margin:0}
.gym-card{background:var(--g-surf);border:1px solid var(--g-border);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer}
.gym-card:active{border-color:var(--g-text2)}
.gym-chip{display:inline-flex;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:500;margin:2px}
.gym-input,.gym-select,.gym-textarea{width:100%;background:var(--g-surf2);border:1px solid var(--g-border);color:var(--g-text);border-radius:8px;padding:10px;font-size:16px;box-sizing:border-box;margin-bottom:8px;font-family:inherit}
.gym-textarea{resize:vertical;font-size:12px;font-family:monospace}
.gym-btn{border:1px solid var(--g-border);background:var(--g-surf2);color:var(--g-text);border-radius:8px;padding:10px 14px;font-size:14px;cursor:pointer}
.gym-btn-primary{color:#fff;border:none}
.gym-btn-danger{color:#fff;border:none;background:#993c1d}
.gym-btn-toggle{border:1px solid var(--g-border);background:var(--g-surf2);color:var(--g-text2);border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer}
.gym-btn-toggle.on{color:#fff;border-color:transparent}
.gym-label{font-size:12px;color:var(--g-text2);margin-bottom:4px;display:block}
.gym-footer{display:flex;justify-content:center;margin-top:16px;padding-top:12px;border-top:1px solid var(--g-border)}
.gym-empty{text-align:center;padding:60px 0}
.gym-empty p{color:var(--g-muted);font-size:14px;margin-bottom:20px}
.gym-tag{background:#181818;border:1px solid var(--g-border);border-radius:8px;padding:8px 10px;font-size:12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.gym-tag i{cursor:pointer;color:var(--g-muted);font-size:16px}
.gym-tag.dragging{opacity:0.35}
.gym-draghandle{cursor:grab;touch-action:none}
.gym-exrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--g-border);gap:8px}
.gym-exrow.dragging{opacity:0.35}
.gym-day-chip{display:inline-flex;padding:5px 11px;border-radius:16px;font-size:12px;margin:3px 4px 3px 0;cursor:pointer;border:1px solid var(--g-border);background:var(--g-surf2);color:var(--g-text2)}
.gym-day-chip.sel{color:#fff;border-color:transparent}
.gym-serie-input{width:52px;text-align:center;background:var(--g-surf2);border:1px solid var(--g-border);color:var(--g-text);border-radius:6px;padding:8px 4px;font-size:14px}
.gym-serie-input.done{border-color:#5DCAA5;background:#0f2b22;color:#9FE1CB}
.gym-slot{text-align:center}
.gym-slot-labels{display:flex;gap:4px;justify-content:center;margin-bottom:2px}
.gym-slot-labels span{font-size:9px;color:var(--g-muted);width:52px}
.gym-prevchip{font-size:13px;font-weight:500;color:#fff;background:#3d3567;border-radius:6px;padding:4px 8px;margin-top:5px;cursor:pointer;white-space:nowrap}
.gym-note-badge{font-size:11px;color:var(--g-muted);font-style:italic;margin-top:2px}
.gym-settings-link{font-size:11px;color:var(--g-muted);cursor:pointer;text-decoration:underline}
.gym-card-actions{display:flex;gap:12px;align-items:center}
.gym-setpill{display:inline-flex;align-items:center;gap:6px;background:#181818;border:1px solid var(--g-border);border-radius:16px;padding:5px 12px;font-size:13px;margin:3px 4px 3px 0}
.storage-warn{background:#412402;color:#FAC775;font-size:12px;padding:8px 10px;border-radius:8px;margin-bottom:12px;display:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style>
</head>

let view = {page:'dashboard'};

function tryLocalStorage(){
  try{ localStorage.setItem('__test__','1'); localStorage.removeItem('__test__'); return true; }
  catch(e){ return false; }
}
storageOk = tryLocalStorage();
if(!storageOk) document.getElementById('storageWarn').style.display = 'block';

function pushView(v){
  view = v;
  try{ history.pushState({v:v}, '', '#'+v.page+(v.id?('-'+v.id):'')); }catch(e){}
  render();
}
function goBack(){
  try{ history.back(); }catch(e){ view={page:'dashboard'}; render(); }
}
window.addEventListener('popstate', function(e){
  if(e.state && e.state.v){ view = e.state.v; } else { view = {page:'dashboard'}; }
  render();
});

function ensureSeed14Set(){
  const already = sessioni.some(x=>x.sid===1001 && x.data==='14 set 2026');
  if(already) return;
  const scheda = schede.find(s=>s.id===1001);

  sessioni.push({sid:1001, data:'14 set 2026', ts: Date.UTC(2026,8,14), esercizi:[

function load(){
  let sRaw=null, seRaw=null;
  if(storageOk){
    try{ sRaw = localStorage.getItem('gym7:schede'); }catch(e){}
    try{ seRaw = localStorage.getItem('gym7:sessioni'); }catch(e){}
  }
  const parsedSchede = sRaw? JSON.parse(sRaw): [];
  const parsedSessioni = seRaw? JSON.parse(seRaw): [];
  if(parsedSchede.length===0 && parsedSessioni.length===0 && DEFAULT_DATA.schede.length>0){
    schede = JSON.parse(JSON.stringify(DEFAULT_DATA.schede));
    sessioni = JSON.parse(JSON.stringify(DEFAULT_DATA.sessioni));
    saveSchede(); saveSessioni();
  } else {
    schede = parsedSchede;
    sessioni = parsedSessioni;
  }
  schede.forEach(s=>s.esercizi.forEach(ex=>{ if(!ex.tipo) ex.tipo = 'reps'; }));
  ensureSeed14Set();
  render();
  syncSessioniFromDb();
}
async function getDb(){
  try{ return await claude.use('db'); }catch(e){ return null; }

async function syncSessioniFromDb(){
  const db = await getDb();
  if(!db) return;
  try{
    const snap = await db.collection('sessioni').get();
    let changed = false;
    snap.docs.forEach(d=>{
      const data = d.data();
      if(data && data.ts!=null){
        const exists = sessioni.some(x=>x.sid===data.sid && x.ts===data.ts);
        if(!exists){ sessioni.push(data); changed = true; }
      }
    });
    if(changed){
      saveSessioni();
      if(view.page==='dashboard' || view.page==='storico' || view.page==='trend') render();
    }
  }catch(e){}
}
async function pushSessioneToDb(sessione){

}
async function deleteSessioneFromDb(ts){

function normSlot(v){
  if(v==null) return {rep:'', kg:''};
  if(typeof v === 'object') return {rep: v.rep!=null? v.rep: '', kg: v.kg!=null? v.kg: ''};
  return {rep: String(v), kg:''};
}
function formatDuration(ms){
  const totalSec = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60), sec = totalSec%60;
  const mm = String(m).padStart(2,'0'), ss = String(sec).padStart(2,'0');
  return h>0 ? (h+':'+mm+':'+ss) : (mm+':'+ss);
}
function buildSessionImage(scheda, ses, colorHex){
  const width = 720;
  const padding = 32;
  const measureCanvas = document.createElement('canvas');
  const mctx = measureCanvas.getContext('2d');
  function wrapText(text, font, maxWidth){
    mctx.font = font;
    const words = String(text).split(' ');
    const lines = [];
    let cur = '';
    words.forEach(w=>{
      const test = cur ? (cur+' '+w) : w;
      if(mctx.measureText(test).width > maxWidth && cur){ lines.push(cur); cur = w; }
      else cur = test;
    });
    if(cur) lines.push(cur);
    return lines;
  }

  const blocks = [];
  blocks.push({type:'brand', text:'PUMP APP', h:20});
  blocks.push({type:'title', text:scheda.nome, h:32});
  const subtitle = ses.data + (ses.durata ? '  \u00b7  ' + formatDuration(ses.durata*1000) : '');
  blocks.push({type:'subtitle', text:subtitle, h:28});

  ses.esercizi.forEach(ex=>{
    blocks.push({type:'exname', text:ex.nome, h:24});
    const u = unitLabel(ex.tipo);
    const setsText = ex.serie_log.map((v,i)=>{
      const slot = normSlot(v);
      const hasVal = slot.rep!=='' || slot.kg!=='';
      const label = hasVal ? ((slot.kg!==''? (slot.kg+'kg\u00b7') : '') + (slot.rep!==''? (slot.rep+u) : '\u2014')) : '\u2014';
      return 'S'+(i+1)+' '+label;
    }).join('   ');
    wrapText(setsText, '13px sans-serif', width-2*padding).forEach(line=>{
      blocks.push({type:'sets', text:line, h:20});
    });
    if(ex.nota && ex.nota.trim()!==''){
      wrapText(ex.nota, 'italic 12px sans-serif', width-2*padding).forEach(line=>{
        blocks.push({type:'note', text:line, h:18});
      });
    }
    blocks.push({type:'gap', text:'', h:12});
  });

  let totalH = padding;
  blocks.forEach(b=>{ totalH += b.h; });
  totalH += padding;

  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = Math.ceil(totalH);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#0f0f0f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  let y = padding;
  blocks.forEach(b=>{
    if(b.type==='brand'){ ctx.font='11px sans-serif'; ctx.fillStyle='#666666'; ctx.fillText(b.text, padding, y+10); }
    else if(b.type==='title'){ ctx.font='bold 22px sans-serif'; ctx.fillStyle=colorHex; ctx.fillText(b.text, padding, y+18); }
    else if(b.type==='subtitle'){ ctx.font='13px sans-serif'; ctx.fillStyle='#aaaaaa'; ctx.fillText(b.text, padding, y+12); }
    else if(b.type==='exname'){ ctx.font='bold 15px sans-serif'; ctx.fillStyle='#f5f5f5'; ctx.fillText(b.text, padding, y+13); }
    else if(b.type==='sets'){ ctx.font='13px sans-serif'; ctx.fillStyle='#f5f5f5'; ctx.fillText(b.text, padding, y+11); }
    else if(b.type==='note'){ ctx.font='italic 12px sans-serif'; ctx.fillStyle='#888888'; ctx.fillText(b.text, padding, y+10); }
    y += b.h;
  });
  return canvas;
}

function unitLabel(tipo){ return tipo==='tempo' ? 's' : 'reps'; }
function copyText(text){
  try{ navigator.clipboard.writeText(text); return true; }
  catch(e){
    try{
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      return true;
    }catch(e2){ return false; }
  }
}
function enableDragSort(container, arr, drawFn, afterReorder){
  let draggingId = null;
  function onMove(e){
    if(draggingId==null) return;
    e.preventDefault();
    const pt = e.touches ? e.touches[0] : e;
    const el = document.elementFromPoint(pt.clientX, pt.clientY);
    const tag = el && el.closest ? el.closest('[data-tagid]') : null;
    if(tag){
      const overId = Number(tag.getAttribute('data-tagid'));
      if(overId !== draggingId){
        const fromIdx = arr.findIndex(x=>x.id===draggingId);
        const toIdx = arr.findIndex(x=>x.id===overId);
        if(fromIdx>-1 && toIdx>-1){
          const item = arr.splice(fromIdx,1)[0];
          arr.splice(toIdx,0,item);
          drawFn();
          const newTag = container.querySelector('[data-tagid="'+draggingId+'"]');
          if(newTag) newTag.classList.add('dragging');
        }
      }
    }
  }
  function onUp(){
    draggingId = null;
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    if(afterReorder) afterReorder();
  }
  container.querySelectorAll('[data-draghandle]').forEach(handle=>{
    handle.onpointerdown = (e)=>{
      e.preventDefault();
      draggingId = Number(handle.getAttribute('data-draghandle'));
      const tag = handle.closest('[data-tagid]');
      if(tag) tag.classList.add('dragging');
      document.addEventListener('pointermove', onMove, {passive:false});
      document.addEventListener('pointerup', onUp);
    };
  });
}

}

    html += '<button class="gym-btn" id="templateBtn">Copia template vuoto</button>';
    html += '<div id="templateMsg" style="font-size:12px;color:#5DCAA5;margin:6px 0"></div></div>';
    html += '<div style="margin-top:30px;padding-top:16px;border-top:1px solid var(--g-border)">';
    if(resetStep===0){
      html += '<span class="gym-settings-link" id="resetLink">Cancella tutti i dati</span>';
    } else if(resetStep===1){
      html += '<div style="font-size:13px;margin-bottom:8px">Sicuro che vuoi cancellare tutto?</div>' +
        '<button class="gym-btn" id="resetNo">Annulla</button> <button class="gym-btn gym-btn-danger" id="resetYes">Continua</button>';
    } else if(resetStep===2){
      html += '<div style="font-size:13px;margin-bottom:8px">Bro, sicuro sicuro?</div>' +
        '<button class="gym-btn" id="resetNo">Annulla</button> <button class="gym-btn gym-btn-danger" id="resetYes">Continua</button>';
    } else if(resetStep===3){
      html += '<div style="font-size:13px;margin-bottom:8px">Ok, conferma che non stai schiacciando a caso!</div>' +
        '<button class="gym-btn" id="resetNo">Annulla</button> <button class="gym-btn gym-btn-danger" id="resetFinal">Cancella tutto</button>';
    }
    html += '</div>';
    r.innerHTML = html;
    document.getElementById('back').onclick = ()=>{ goBack(); };
    document.getElementById('copyBtn').onclick = ()=>{
      const ok = copyText(exportData);
      document.getElementById('copyMsg').textContent = ok ? 'Copiato negli appunti.' : 'Copia non riuscita, seleziona il testo manualmente.';
    };
    document.getElementById('templateBtn').onclick = ()=>{
      const ok = copyText(JSON.stringify(IMPORT_TEMPLATE, null, 2));
      document.getElementById('templateMsg').textContent = ok ? 'Template copiato negli appunti.' : 'Copia non riuscita, seleziona il testo manualmente.';
    };
    document.getElementById('importBtn').onclick = ()=>{
      const raw = document.getElementById('importBox').value.trim();
      const m = document.getElementById('importMsg');
      if(!raw){ m.style.color='#E24B4A'; m.textContent = 'Incolla prima il JSON da importare'; return; }
      try{
        const parsed = JSON.parse(raw);
        if(!Array.isArray(parsed.schede) || !Array.isArray(parsed.sessioni)) throw new Error('formato non valido');
        parsed.schede.forEach(s=>s.esercizi.forEach(ex=>{ if(!ex.tipo) ex.tipo='reps'; }));
        schede = parsed.schede; sessioni = parsed.sessioni;
        saveSchede(); saveSessioni();
        m.style.color='#5DCAA5'; m.textContent = 'Dati importati correttamente.';
        draw();
      }catch(err){
        m.style.color='#E24B4A'; m.textContent = 'JSON non valido: '+err.message;
      }
    };
    const resetLink = document.getElementById('resetLink');
    if(resetLink) resetLink.onclick = ()=>{ resetStep = 1; draw(); };
    const resetNo = document.getElementById('resetNo');
    if(resetNo) resetNo.onclick = ()=>{ resetStep = 0; draw(); };
    const resetYes = document.getElementById('resetYes');
    if(resetYes) resetYes.onclick = ()=>{ resetStep += 1; draw(); };
    const resetFinal = document.getElementById('resetFinal');
    if(resetFinal) resetFinal.onclick = ()=>{
      schede = []; sessioni = [];
      saveSchede(); saveSessioni();
      resetStep = 0;
      pushView({page:'dashboard'});
    };
  }
  draw();
}

        '<i class="" data-rmex="'+i+'" aria-label="Rimuovi esercizio">✕</i></span></div>';
    });
    if(pendingRename){
      html += renameConfirmHtml(pendingRename.oldName, pendingRename.v.nome);
    } else if(addingEx){
      const cur = editIdx!==null ? esList[editIdx] : {nome:'', serie:'', reps:'', riposo:'', tipo:'reps'};
      html += '<div style="background:var(--g-surf2);border-radius:8px;padding:10px;margin:8px 0">' + exFormHtml(cur) +
        '<button class="gym-btn" id="exSave">'+(editIdx!==null?'Salva modifiche':'Aggiungi')+'</button> <button class="gym-btn" id="exCancel">Annulla</button></div>';
    } else {
      html += '<button class="gym-fab gym-fab-small" style="background:#0F6E56;margin:10px 0" id="addEx" aria-label="Aggiungi esercizio"><i class="" aria-hidden="true">+</i></button>';
    }
    html += '<div id="formErr" style="color:#E24B4A;font-size:13px;margin:8px 0"></div>';
    html += '<button class="gym-btn gym-btn-primary" style="background:'+c.main+';width:100%;margin-top:10px" id="saveScheda">Salva scheda</button>';
    r.innerHTML = html;

    function applyPending(){
      if(editIdx!==null) esList[editIdx] = Object.assign({}, esList[editIdx], pendingRename.v);
      else esList.push(Object.assign({id:Date.now()+Math.random()}, pendingRename.v));
      pendingRename = null; addingEx = false; editIdx = null; draw();
    }

    document.getElementById('nome').oninput = (e)=>{ nomeVal = e.target.value; };
    document.getElementById('back').onclick = ()=>{ goBack(); };
    r.querySelectorAll('[data-col]').forEach(el=>el.onclick=()=>{ selColor = Number(el.getAttribute('data-col')); draw(); });
    r.querySelectorAll('[data-day]').forEach(el=>el.onclick=()=>{
      const d = el.getAttribute('data-day');
      selDays = selDays.includes(d) ? selDays.filter(x=>x!==d) : selDays.concat([d]);
      draw();
    });
    r.querySelectorAll('[data-rmex]').forEach(el=>el.onclick=()=>{
      esList.splice(Number(el.getAttribute('data-rmex')),1); draw();
    });
    r.querySelectorAll('[data-editex2]').forEach(el=>el.onclick=()=>{
      const i = Number(el.getAttribute('data-editex2'));
      editIdx = i; addingEx = true; draw();
    });
    enableDragSort(r, esList, draw, null);
    const addExBtn = document.getElementById('addEx');
    if(addExBtn) addExBtn.onclick = ()=>{ editIdx = null; addingEx = true; draw(); };
    const exCancel = document.getElementById('exCancel');
    if(exCancel) exCancel.onclick = ()=>{ addingEx = false; editIdx = null; draw(); };
    if(pendingRename){
      document.getElementById('keepHist').onclick = ()=>{
        renameHistory(scheda.id, pendingRename.oldName, pendingRename.v.nome);
        applyPending();
      };
      document.getElementById('newHist').onclick = ()=>{ applyPending(); };
    }
    if(addingEx){
      const cur = editIdx!==null ? esList[editIdx] : {nome:'', serie:'', reps:'', riposo:'', tipo:'reps'};
      const getVal = wireExForm(r, cur);
      document.getElementById('exSave').onclick = ()=>{
        const v = getVal();
        if(!v) return;
        if(editIdx!==null && esList[editIdx].nome!==v.nome && hasHistory(scheda.id, esList[editIdx].nome)){
          pendingRename = {v, oldName: esList[editIdx].nome};
          draw();
          return;
        }
        if(editIdx!==null) esList[editIdx] = Object.assign({}, esList[editIdx], v);
        else esList.push(Object.assign({id:Date.now()+Math.random()}, v));
        addingEx = false; editIdx = null; draw();
      };
    }
    document.getElementById('saveScheda').onclick = ()=>{
      const nome = nomeVal.trim();
      const err = document.getElementById('formErr');
      if(!nome){ err.textContent = 'Il nome è obbligatorio'; return; }
      if(selDays.length===0){ err.textContent = 'Seleziona almeno un giorno'; return; }
      scheda.nome = nome; scheda.color = selColor; scheda.giorni = selDays; scheda.esercizi = esList;
      if(!editing) schede.push(scheda);
      else { const idx = schede.findIndex(s=>s.id===scheda.id); schede[idx] = scheda; }
      saveSchede();
      pushView({page:'detail', id:scheda.id});
    };
  }
  draw();
}

function hasHistory(schedaId, nome){
  return sessioni.some(x=>x.sid===schedaId && x.esercizi.some(e=>e.nome===nome));
}
function renameHistory(schedaId, oldName, newName){
  let changed = false;
  sessioni.forEach(ses=>{
    if(ses.sid===schedaId){
      ses.esercizi.forEach(e=>{ if(e.nome===oldName){ e.nome=newName; changed=true; } });
    }
  });
  if(changed) saveSessioni();
}
function renameConfirmHtml(oldName, newName){
  return '<div style="background:#1a1830;border:1px solid #7F77DD55;border-radius:8px;padding:12px;margin:8px 0">' +
    '<div style="font-size:13px;margin-bottom:10px">Hai rinominato <b>'+esc(oldName)+'</b> in <b>'+esc(newName)+'</b>. Lo storico delle sessioni passate è collegato al vecchio nome — vuoi mantenerlo?</div>' +
    '<button class="gym-btn gym-btn-primary" style="background:#5DCAA5" id="keepHist">Mantieni storico</button> ' +
    '<button class="gym-btn" id="newHist">Inizia storico nuovo</button></div>';
}

function findPrevSession(schedaId, nomeEsercizio){
  const mie = sessioni.filter(x=>x.sid===schedaId).slice().sort((a,b)=>b.ts-a.ts);
  for(const ses of mie){
    const found = ses.esercizi.find(e=>e.nome===nomeEsercizio);
    if(found) return found;
  }
  return null;
}

function renderSession(r){
  const s = schede.find(x=>x.id===view.id);
  if(!s){ view={page:'dashboard'}; return render(); }
  const c = COLORS[s.color||0];
  const saved = loadInProgress();
  const resuming = !!(saved && saved.schedaId===s.id);
  const log = resuming ? saved.log.map(ex=>({
      nome:ex.nome, serie:ex.serie, reps:ex.reps, riposo:ex.riposo, tipo:ex.tipo||'reps',
      nota: ex.nota || '',
      serie_log: ex.serie_log,
      prev: findPrevSession(s.id, ex.nome)
    })) : s.esercizi.map(ex=>{
    const prev = findPrevSession(s.id, ex.nome);
    return {
      nome:ex.nome, serie:ex.serie, reps:ex.reps, riposo:ex.riposo, tipo:ex.tipo||'reps',
      nota: (prev && prev.nota) ? prev.nota : '',
      serie_log: new Array(ex.serie).fill(null).map(()=>({rep:'', kg:''})),
      prev: prev
    };
  });
  const sessionStartTs = resuming ? saved.sessionStartTs : Date.now();
  if(!resuming) saveInProgress(s.id, sessionStartTs, log);
  let timerInterval = setInterval(()=>{
    const el = document.getElementById('sessTimer');
    if(el) el.textContent = formatDuration(Date.now()-sessionStartTs);
  }, 1000);
  function stopTimer(){ if(timerInterval){ clearInterval(timerInterval); timerInterval=null; } }

  function draw(){
    let html = '<div class="gym-topbar"><i class="" id="back" aria-label="Indietro">←</i><div class="gym-title" style="color:'+c.main+'">Sessione: '+esc(s.nome)+'</div></div>';
    html += '<div style="font-size:12px;color:var(--g-muted);margin-bottom:12px">\u23F1 <span id="sessTimer">'+formatDuration(Date.now()-sessionStartTs)+'</span></div>';
    log.forEach((ex,ei)=>{
      const u = unitLabel(ex.tipo);
      const anyFilledInit = ex.serie_log.some(v=>v.rep.toString().trim()!=='' || v.kg.toString().trim()!=='');
      const allFilledInit = ex.serie_log.every(v=>v.rep.toString().trim()!=='');
      const doneBg = 'rgba(93,202,165,0.10)';
      const doneBorder = '#5DCAA5';
      html += '<div id="exblock'+ei+'" style="margin-bottom:16px;padding:8px;border-radius:8px;border-left:3px solid '+(allFilledInit? doneBorder : (anyFilledInit? c.main:'transparent'))+';background:'+(allFilledInit? doneBg : (anyFilledInit? c.bg:'transparent'))+';transition:border-color .2s,background .2s">';
      html += '<div style="font-size:14px;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap">'+esc(ex.nome)+
        ' <span id="exCheck'+ei+'" style="display:'+(allFilledInit?'inline-flex':'none')+';align-items:center;gap:4px;background:#5DCAA5;color:#0f2b22;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px">\u2713 Completato</span>' +
        ' <span class="gym-chip" style="background:'+c.bg+';color:'+c.main+';font-size:11px;font-weight:600">'+ex.serie+'&times;'+ex.reps+u+'</span>' +
        ' <span style="font-size:11px;color:var(--g-muted);font-weight:400">riposo '+ex.riposo+'s</span></div>';
      html += '<div style="display:flex;gap:8px;flex-wrap:wrap">';
      for(let i=0;i<ex.serie;i++){
        const prevSlot = ex.prev ? normSlot(ex.prev.serie_log[i]) : null;
        const hasPrev = prevSlot && (prevSlot.rep!=='' || prevSlot.kg!=='');
        html += '<div class="gym-slot">' +
          '<div class="gym-slot-labels"><span>kg</span><span>'+u+'</span></div>' +
          '<div style="display:flex;gap:3px">' +
          '<input class="gym-serie-input" data-ex="'+ei+'" data-serie="'+i+'" data-field="kg" type="number" placeholder="0" value="'+ex.serie_log[i].kg+'">' +
          '<input class="gym-serie-input" data-ex="'+ei+'" data-serie="'+i+'" data-field="rep" type="number" placeholder="0" value="'+ex.serie_log[i].rep+'">' +
          '</div>' +
          '<div style="font-size:10px;color:var(--g-muted);margin-top:2px">goal: '+ex.reps+u+'</div>' +
          (hasPrev ? '<div class="gym-prevchip" data-copyex="'+ei+'" data-copyserie="'+i+'" data-rep="'+esc(prevSlot.rep)+'" data-kg="'+esc(prevSlot.kg)+'">prec: '+(prevSlot.kg?esc(prevSlot.kg)+'kg&times;':'')+esc(prevSlot.rep)+'</div>' : '') +
          '</div>';
      }
      html += '</div>';
      html += '<input class="gym-input" data-noteex="'+ei+'" placeholder="Nota (es. ceduto, forzate, assistite...)" value="'+esc(ex.nota)+'" style="margin-top:8px">';
      html += '</div>';
    });
    html += '<div id="sessErr" style="color:#E24B4A;font-size:13px;margin:8px 0"></div>';
    html += '<button class="gym-btn gym-btn-primary" style="background:'+c.main+';width:100%" id="finish">Termina e salva</button>';
    r.innerHTML = html;

    document.getElementById('back').onclick = ()=>{ stopTimer(); goBack(); };
    r.querySelectorAll('.gym-serie-input').forEach(inp=>{
      inp.oninput = ()=>{
        const ei = Number(inp.getAttribute('data-ex')), si = Number(inp.getAttribute('data-serie')), f = inp.getAttribute('data-field');
        log[ei].serie_log[si][f] = inp.value;
        const bothFilled = log[ei].serie_log[si].rep.toString().trim()!=='';
        r.querySelectorAll('[data-ex="'+ei+'"][data-serie="'+si+'"]').forEach(x=>x.classList.toggle('done', bothFilled));
        const anyFilled = log[ei].serie_log.some(v=>v.rep.toString().trim()!=='' || v.kg.toString().trim()!=='');
        const allFilled = log[ei].serie_log.every(v=>v.rep.toString().trim()!=='');
        const block = document.getElementById('exblock'+ei);
        if(block){
          block.style.borderLeftColor = allFilled ? '#5DCAA5' : (anyFilled ? c.main : 'transparent');
          block.style.background = allFilled ? 'rgba(93,202,165,0.10)' : (anyFilled ? (c.bg||'transparent') : 'transparent');
        }
        const check = document.getElementById('exCheck'+ei);
        if(check) check.style.display = allFilled ? 'inline-flex' : 'none';
        saveInProgress(s.id, sessionStartTs, log);
      };
    });
    r.querySelectorAll('[data-noteex]').forEach(inp=>{
      inp.oninput = ()=>{ log[Number(inp.getAttribute('data-noteex'))].nota = inp.value; saveInProgress(s.id, sessionStartTs, log); };
    });
    r.querySelectorAll('[data-copyex]').forEach(chip=>chip.onclick=()=>{
      const ei = Number(chip.getAttribute('data-copyex')), si = Number(chip.getAttribute('data-copyserie'));
      const rep = chip.getAttribute('data-rep'), kg = chip.getAttribute('data-kg');
      log[ei].serie_log[si] = {rep, kg};
      saveInProgress(s.id, sessionStartTs, log);
      draw();
    });
    document.getElementById('finish').onclick = ()=>{
      const anyFilled = log.some(ex=>ex.serie_log.some(v=>v.rep.toString().trim()!==''));
      const err = document.getElementById('sessErr');
      if(!anyFilled){ err.textContent = 'Registra almeno una serie prima di salvare'; return; }
      stopTimer();
      const now = new Date();
      const mesi = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
      const dataStr = now.getDate()+' '+mesi[now.getMonth()]+' '+now.getFullYear();
      const durataSec = Math.round((Date.now()-sessionStartTs)/1000);
      const toSave = log.map(ex=>({nome:ex.nome, serie:ex.serie, reps:ex.reps, riposo:ex.riposo, tipo:ex.tipo, serie_log:ex.serie_log, nota:ex.nota}));
      const nuovaSessione = {sid:s.id, data:dataStr, ts:now.getTime(), durata:durataSec, esercizi:toSave};
      sessioni.push(nuovaSessione);
      pushSessioneToDb(nuovaSessione);
      clearInProgress();
      const mine = sessioni.filter(x=>x.sid===s.id);
      if(mine.length>30){
        const toRemove = mine.length-30;
        let removed=0;
        sessioni = sessioni.filter(x=>{
          if(x.sid===s.id && removed<toRemove){ removed++; return false; }
          return true;
        });
      }
      saveSessioni();
      goBack();
    };
  }
  draw();
}

function renderStorico(r){
  const s = schede.find(x=>x.id===view.id);
  if(!s){ view={page:'dashboard'}; return render(); }
  const c = COLORS[s.color||0];
  let pendingDel = null;

  function draw(){
    const mie = sessioni.filter(x=>x.sid===s.id).slice().sort((a,b)=>b.ts-a.ts);
    let html = '<div class="gym-topbar"><i class="" id="back" aria-label="Indietro">\u2190</i><div class="gym-title" style="color:'+c.main+'">Sessioni: '+esc(s.nome)+'</div></div>';
    if(mie.length===0){
      html += '<div class="gym-empty"><p>Nessuna sessione registrata</p></div>';
    } else {
      mie.forEach(ses=>{
        const totReps = ses.esercizi.reduce((sum,ex)=>sum + ex.serie_log.reduce((a,v)=>a+(Number(normSlot(v).rep)||0),0), 0);
        const note = ses.esercizi.filter(ex=>ex.nota && ex.nota.trim()!=='').map(ex=>esc(ex.nome)+': '+esc(ex.nota)).join(' &middot; ');
        if(pendingDel===ses.ts){
          html += '<div class="gym-card" style="cursor:default;border-left:3px solid #E24B4A">' +
            '<div style="font-size:13px;margin-bottom:8px">Eliminare la sessione del '+ses.data+'? Non si può annullare.</div>' +
            '<button class="gym-btn" data-canceldel="1">Annulla</button> <button class="gym-btn gym-btn-danger" data-confirmdel="'+ses.ts+'">Elimina</button>' +
            '</div>';
        } else {
          html += '<div class="gym-card" data-openses="'+ses.ts+'" style="border-left:3px solid '+c.main+'">' +
            '<div style="display:flex;justify-content:space-between;align-items:flex-start">' +
            '<div style="font-size:14px;font-weight:600">'+ses.data+(ses.durata? ' <span style="font-size:11px;color:var(--g-muted);font-weight:400">&middot; \u23F1 '+formatDuration(ses.durata*1000)+'</span>':'')+'</div>' +
            '<i data-delses="'+ses.ts+'" aria-label="Elimina sessione" style="color:var(--g-muted);font-size:15px;cursor:pointer">\u2715</i></div>' +
            '<div style="font-size:12px;color:var(--g-text2)">'+ses.esercizi.length+' esercizi &middot; '+totReps+' reps/sec totali</div>' +
            (note ? '<div class="gym-note-badge">'+note+'</div>' : '') +
            '</div>';
        }
      });
    }
    html += '<div class="gym-footer" style="gap:8px"><button class="gym-btn" id="trendBtn">Vedi trend</button><button class="gym-btn" id="toDash">Dashboard</button></div>';
    r.innerHTML = html;
    document.getElementById('back').onclick = ()=>{ goBack(); };
    document.getElementById('toDash').onclick = ()=>{ pushView({page:'dashboard'}); };
    document.getElementById('trendBtn').onclick = ()=>{ pushView({page:'trend', id:s.id}); };
    r.querySelectorAll('[data-openses]').forEach(el=>el.onclick=()=>{
      pushView({page:'sessionDetail', id:s.id, sessTs:Number(el.getAttribute('data-openses'))});
    });
    r.querySelectorAll('[data-delses]').forEach(el=>el.onclick=(e)=>{
      e.stopPropagation();
      pendingDel = Number(el.getAttribute('data-delses'));
      draw();
    });
    const cancelBtn = r.querySelector('[data-canceldel]');
    if(cancelBtn) cancelBtn.onclick = ()=>{ pendingDel = null; draw(); };
    const confirmBtn = r.querySelector('[data-confirmdel]');
    if(confirmBtn) confirmBtn.onclick = ()=>{
      const t = Number(confirmBtn.getAttribute('data-confirmdel'));
      sessioni = sessioni.filter(x=>!(x.sid===s.id && x.ts===t));
      saveSessioni();
      deleteSessioneFromDb(t);
      pendingDel = null;
      draw();
    };
  }
  draw();
}

function renderSessionDetail(r){
  const s = schede.find(x=>x.id===view.id);
  if(!s){ view={page:'dashboard'}; return render(); }
  const ses = sessioni.find(x=>x.sid===view.id && x.ts===view.sessTs);
  if(!ses){ view={page:'storico', id:s.id}; return render(); }
  const c = COLORS[s.color||0];
  let confirmDel = false;

  function draw(){
    let html = '<div class="gym-topbar"><i id="back" aria-label="Indietro">\u2190</i><div class="gym-title" style="color:'+c.main+'">'+esc(ses.data)+'</div>' +
      '<i id="saveImg" aria-label="Salva come immagine" style="color:var(--g-muted);font-size:16px;cursor:pointer">\u2913</i>' +
      '<i id="delSes" aria-label="Elimina sessione" style="color:var(--g-muted);font-size:17px;cursor:pointer">\u2715</i></div>';
    if(confirmDel){
      html += '<div style="background:#2a1414;border:1px solid #501313;border-radius:8px;padding:12px;margin-bottom:16px">' +
        '<div style="font-size:13px;margin-bottom:8px">Eliminare questa sessione? Non si può annullare.</div>' +
        '<button class="gym-btn" id="cancelDel">Annulla</button> <button class="gym-btn gym-btn-danger" id="confirmDel">Elimina</button>' +
        '</div>';
    }
    html += '<div id="captureArea" style="background:var(--g-bg);padding:2px">';
    html += '<div style="font-size:16px;font-weight:700;color:'+c.main+';margin-bottom:2px">'+esc(s.nome)+'</div>';
    html += '<div style="font-size:12px;color:var(--g-text2);margin-bottom:14px">'+esc(ses.data)+(ses.durata? ' &middot; \u23F1 '+formatDuration(ses.durata*1000):'')+' &middot; Pump App</div>';
    ses.esercizi.forEach(ex=>{
      const u = unitLabel(ex.tipo);
      html += '<div style="margin-bottom:16px"><div style="font-size:14px;font-weight:600;margin-bottom:6px">'+esc(ex.nome)+'</div>';
      html += '<div>';
      ex.serie_log.forEach((v,i)=>{
        const slot = normSlot(v);
        const hasVal = slot.rep!=='' || slot.kg!=='';
        const label = hasVal
          ? (slot.kg!==''? esc(slot.kg)+'kg &middot; ' : '') + (slot.rep!=='' ? esc(slot.rep)+u : '&mdash;')
          : '&mdash;';
        html += '<span class="gym-setpill" style="border-color:'+c.main+'55"><b>S'+(i+1)+'</b> '+label+'</span>';
      });
      html += '</div>';
      if(ex.nota && ex.nota.trim()!==''){
        html += '<div class="gym-note-badge" style="margin-top:6px">'+esc(ex.nota)+'</div>';
      }
      html += '</div>';
    });
    html += '</div>';
    html += '<div id="saveImgMsg" style="font-size:12px;color:#5DCAA5;margin:6px 0"></div>';
    html += '<div class="gym-footer"><button class="gym-btn" id="toStorico">Torna alle sessioni</button></div>';
    r.innerHTML = html;
    document.getElementById('back').onclick = ()=>{ goBack(); };
    document.getElementById('toStorico').onclick = ()=>{ goBack(); };
    document.getElementById('delSes').onclick = ()=>{ confirmDel = true; draw(); };
    document.getElementById('saveImg').onclick = async ()=>{
      const msg = document.getElementById('saveImgMsg');
      msg.style.color='#aaa';
      msg.textContent = 'Genero immagine...';
      let downloads;
      try{ downloads = await claude.use('downloads'); }catch(e){ downloads = null; }
      if(!downloads){
        msg.style.color='#E24B4A';
        msg.textContent = 'Salvataggio file non disponibile in questa visualizzazione.';
        return;
      }
      try{
        const canvas = buildSessionImage(s, ses, c.main);
        const blob = await new Promise(resolve=>canvas.toBlob(resolve, 'image/png'));
        const safeName = (s.nome+'-'+ses.data).replace(/[^a-z0-9]+/gi,'-').toLowerCase();
        await downloads.save({filename: 'pump-app-'+safeName+'.png', data: blob});
        msg.style.color='#5DCAA5';
        msg.textContent = 'Immagine salvata.';
      }catch(err){
        msg.style.color='#E24B4A';
        if(err && err.code==='declined') msg.textContent = 'Salvataggio annullato.';
        else if(err && err.code==='rate_limited') msg.textContent = 'Riprova tra un istante.';
        else msg.textContent = 'Errore durante il salvataggio dell immagine.';
      }
    };
    const cancelBtn = document.getElementById('cancelDel');
    if(cancelBtn) cancelBtn.onclick = ()=>{ confirmDel = false; draw(); };
    const confirmBtn = document.getElementById('confirmDel');
    if(confirmBtn) confirmBtn.onclick = ()=>{
      sessioni = sessioni.filter(x=>!(x.sid===s.id && x.ts===ses.ts));
      saveSessioni();
      deleteSessioneFromDb(ses.ts);
      goBack();
    };
  }
  draw();
}


function renderTrend(r){
  const s = schede.find(x=>x.id===view.id);
  if(!s){ view={page:'dashboard'}; return render(); }
  const c = COLORS[s.color||0];
  const mie = sessioni.filter(x=>x.sid===s.id).slice().sort((a,b)=>a.ts-b.ts);
  let html = '<div class="gym-topbar"><i class="" id="back" aria-label="Indietro">←</i><div class="gym-title" style="color:'+c.main+'">Trend: '+esc(s.nome)+'</div></div>';
  if(mie.length<2){
    html += '<div class="gym-empty"><p>Servono almeno 2 sessioni per vedere il trend</p></div>';
    html += '<div class="gym-footer"><button class="gym-btn" id="toDash">Dashboard</button></div>';
    r.innerHTML = html;
    document.getElementById('back').onclick = ()=>{ goBack(); };
    document.getElementById('toDash').onclick = ()=>{ pushView({page:'dashboard'}); };
    return;
  }
  html += '<div style="display:flex;gap:14px;font-size:11px;color:var(--g-text2);margin-bottom:6px">' +
    '<span><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'+KG_COLOR+';margin-right:5px"></span>Peso (kg)</span>' +
    '<span><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'+REPS_COLOR+';margin-right:5px"></span>Reps/tempo</span></div>';
  s.esercizi.forEach((ex,i)=>{
    const u = unitLabel(ex.tipo);
    html += '<div style="font-size:13px;font-weight:600;margin:16px 0 4px">'+esc(ex.nome)+'</div>';
    html += '<div style="font-size:10px;color:var(--g-muted);margin-bottom:4px">media per sessione &middot; kg</div>';
    html += '<div style="position:relative;height:150px;margin-bottom:6px"><canvas id="chartKg'+i+'" role="img" aria-label="Andamento peso medio per '+esc(ex.nome)+'"></canvas></div>';
    html += '<div style="font-size:10px;color:var(--g-muted);margin-bottom:4px">media per sessione &middot; '+u+'</div>';
    html += '<div style="position:relative;height:150px;margin-bottom:14px"><canvas id="chartReps'+i+'" role="img" aria-label="Andamento '+u+' medi per '+esc(ex.nome)+'"></canvas></div>';
  });
  html += '<div class="gym-footer"><button class="gym-btn" id="toDash">Dashboard</button></div>';
  r.innerHTML = html;
  document.getElementById('back').onclick = ()=>{ goBack(); };
  document.getElementById('toDash').onclick = ()=>{ pushView({page:'dashboard'}); };

  s.esercizi.forEach((ex,i)=>{
    const labels = [];
    const repsData = [];
    const kgData = [];
    mie.forEach(ses=>{
      const found = ses.esercizi.find(e=>e.nome===ex.nome);
      if(found){
        const slots = found.serie_log.map(v=>normSlot(v));
        const repVals = slots.map(v=>Number(v.rep)).filter(v=>!isNaN(v) && v>0);
        const kgVals = slots.map(v=>Number(v.kg)).filter(v=>!isNaN(v) && v>0);
        if(repVals.length>0 || kgVals.length>0){
          labels.push(ses.data);
          repsData.push(repVals.length? Math.round((repVals.reduce((a,b)=>a+b,0)/repVals.length)*10)/10 : null);
          kgData.push(kgVals.length? Math.round((kgVals.reduce((a,b)=>a+b,0)/kgVals.length)*10)/10 : null);
        }
      }
    });
    const baseOpts = {
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        x:{ticks:{color:'#aaa', font:{size:9}}, grid:{color:'#333'}},
        y:{ticks:{color:'#aaa', font:{size:9}}, grid:{color:'#333'}}
      }
    };
    const ctxReps = document.getElementById('chartReps'+i);
    if(ctxReps && labels.length>0){
      const chart1 = new Chart(ctxReps, {
        type:'line',
        data:{labels, datasets:[{data:repsData, borderColor:REPS_COLOR, backgroundColor:REPS_COLOR, borderWidth:2, tension:0.3, pointRadius:4, pointStyle:'circle', spanGaps:true}]},
        options: baseOpts
      });
      charts.push(chart1);
    }
    const ctxKg = document.getElementById('chartKg'+i);
    if(ctxKg && labels.length>0){
      const chart2 = new Chart(ctxKg, {
        type:'line',
        data:{labels, datasets:[{data:kgData, borderColor:KG_COLOR, backgroundColor:KG_COLOR, borderWidth:2, borderDash:[6,3], tension:0.3, pointRadius:4, pointStyle:'rectRot', spanGaps:true}]},
        options: baseOpts
      });
      charts.push(chart2);
    }
  });
}

try{ history.replaceState({v:{page:'dashboard'}}, '', '#dashboard'); }catch(e){}
load();
})();
</script>
